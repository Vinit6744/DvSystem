<div class="document-list-container">
  <div class="header">
    <h1>Documents</h1>
    <button mat-raised-button color="primary" routerLink="/documents/upload">
      <mat-icon>upload</mat-icon>
      Upload Document
    </button>
  </div>

  <div *ngIf="loading" class="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!loading && documents.length === 0" class="empty-state">
    <mat-icon>folder_open</mat-icon>
    <p>No documents found. Upload your first document to get started.</p>
  </div>

  <div class="documents-grid" *ngIf="!loading && documents.length > 0">
    <mat-card *ngFor="let doc of documents" class="document-card">
      <mat-card-header>
        <mat-card-title>{{ doc.fileName }}</mat-card-title>
        <mat-card-subtitle>Uploaded by {{ doc.uploadedBy }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p><strong>Uploaded:</strong> {{ doc.uploadedAt | date:'short' }}</p>
        <mat-chip [color]="getStatusColor(doc.reviewStatus)">
          {{ doc.reviewStatus }}
        </mat-chip>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" [routerLink]="['/documents', doc.id]">
          <mat-icon>visibility</mat-icon>
          View
        </button>
        <button mat-button color="warn" (click)="deleteDocument(doc.id)">
          <mat-icon>delete</mat-icon>
          Delete
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
