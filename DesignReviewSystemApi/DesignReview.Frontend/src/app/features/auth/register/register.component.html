<div class="register-page">
  <div class="register-panel">
    <mat-card class="register-card">
      <mat-card-header>
        <div class="register-title">
          <mat-icon class="register-icon">person_add</mat-icon>
          <div>
            <mat-card-title>Create user</mat-card-title>
            <mat-card-subtitle>Admins can onboard new reviewers and admins</mat-card-subtitle>
          </div>
        </div>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
          <mat-form-field class="full-width" appearance="outline">
            <mat-label>Username</mat-label>
            <mat-icon matPrefix>person</mat-icon>
            <input matInput formControlName="userName" required>
            <mat-error *ngIf="registerForm.get('userName')?.hasError('required')">
              Username is required
            </mat-error>
          </mat-form-field>

          <mat-form-field class="full-width" appearance="outline">
            <mat-label>Email</mat-label>
            <mat-icon matPrefix>email</mat-icon>
            <input matInput type="email" formControlName="email" required>
            <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
              Email is required
            </mat-error>
            <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
              Invalid email format
            </mat-error>
          </mat-form-field>

          <mat-form-field class="full-width password-field" appearance="outline">
            <mat-label>Password</mat-label>
            <mat-icon matPrefix>lock</mat-icon>
            <input
              matInput
              [type]="hidePassword ? 'password' : 'text'"
              formControlName="password"
              required
            >
            <button
              mat-icon-button
              matSuffix
              type="button"
              (click)="hidePassword = !hidePassword"
              [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
              class="password-toggle-btn"
            >
              <mat-icon class="password-toggle-icon">{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
            <mat-error *ngIf="registerForm.get('password')?.hasError('required')">
              Password is required
            </mat-error>
            <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">
              Password must be at least 6 characters
            </mat-error>
          </mat-form-field>

          <mat-form-field class="full-width" appearance="outline">
            <mat-label>Role</mat-label>
            <mat-select formControlName="role" required>
              <mat-option value="Reviewer">Reviewer</mat-option>
              <mat-option value="Admin">Admin</mat-option>
            </mat-select>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="loading || registerForm.invalid">
            <mat-icon>person_add</mat-icon>
            Register
          </button>

          <div class="links-row">
            <a routerLink="/documents/upload">Back to upload</a>
            <span class="spacer"></span>
            <a routerLink="/auth/login">Back to login</a>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
